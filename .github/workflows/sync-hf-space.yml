name: Sync Demo to HF Space

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'vite.config.js'
      - '.github/workflows/sync-hf-space.yml'
  workflow_dispatch:
    inputs:
      transformers_ref:
        description: 'transformers.js ref (branch/tag/SHA)'
        required: false
        default: ''
      space_id:
        description: 'Hugging Face Space ID to deploy'
        required: false
        default: 'ysdede/tdt-webgpu-demo'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TRANSFORMERS_REPO: ${{ vars.TRANSFORMERS_REPO || 'ysdede/transformers.js' }}
      TRANSFORMERS_REPO_REF: ${{ github.event.inputs.transformers_ref || vars.TRANSFORMERS_REPO_REF || 'v4-nemo-conformer-tdt-main-r2' }}
      HF_SPACE_ID: ${{ github.event.inputs.space_id || 'ysdede/tdt-webgpu-demo' }}

    steps:
      - name: Checkout demo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: tdt-webgpu-demo

      - name: Checkout transformers.js source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TRANSFORMERS_REPO }}
          ref: ${{ env.TRANSFORMERS_REPO_REF }}
          path: transformers.js
          token: ${{ secrets.TRANSFORMERS_REPO_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tdt-webgpu-demo/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Install and build transformers.js (skip typegen)
        working-directory: transformers.js
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @huggingface/transformers exec node scripts/build.mjs

      - name: Install demo dependencies
        working-directory: tdt-webgpu-demo
        run: npm ci

      - name: Build demo
        working-directory: tdt-webgpu-demo
        env:
          TRANSFORMERS_LOCAL: 'true'
          VITE_BASE_PATH: '/'
        run: npm run build

      - name: Create prebuilt HF static export
        working-directory: tdt-webgpu-demo
        run: |
          rm -rf hf_export
          mkdir -p hf_export
          cp -r dist/* hf_export/
          touch hf_export/.nojekyll
          echo "{\"branch\": \"${GITHUB_REF_NAME}\", \"commit\": \"${GITHUB_SHA::7}\"}" > hf_export/git-info.json
          sed -i '/coi-serviceworker\.js/d' hf_export/index.html || true
          rm -f hf_export/coi-serviceworker.js 2>/dev/null || true
          cat > hf_export/README.md <<'EOF'
          ---
          title: Transformers.js v4 Parakeet TDT Demo
          emoji: 🎙️
          colorFrom: blue
          colorTo: indigo
          sdk: static
          pinned: true
          header: mini
          fullWidth: true
          app_file: index.html
          license: mit
          short_description: Browser ASR demo built from transformers.js TDT branch
          models:
          - ysdede/parakeet-tdt-0.6b-v2-onnx-tfjs4
          tags:
          - transformers-js
          - webgpu
          - wasm
          - speech-recognition
          - asr
          - nemo
          - nemo-conformer-tdt
          custom_headers:
            cross-origin-embedder-policy: require-corp
            cross-origin-opener-policy: same-origin
            cross-origin-resource-policy: cross-origin
          ---

          # Transformers.js v4 Parakeet TDT Demo

          Browser ASR demo using Parakeet TDT models via transformers.js.

          Synced from [ysdede/tdt-webgpu-demo](https://github.com/ysdede/tdt-webgpu-demo).

          Built in GitHub Actions from:
          - Demo repo: `ysdede/tdt-webgpu-demo`
          - Transformers source: `ysdede/transformers.js@${TRANSFORMERS_REPO_REF}`

          This Space is deployed from prebuilt static files generated by GitHub Actions. Hugging Face does not run a build step.
          EOF

      - name: Push prebuilt static export to HF Space
        working-directory: tdt-webgpu-demo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf upload "$HF_SPACE_ID" hf_export . \
            --repo-type=space \
            --delete '*' \
            --commit-message "Sync prebuilt static demo (${GITHUB_SHA::7})"
